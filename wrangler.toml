# Pour site — served at https://ipconfig.co.network/pour by its own Worker.
# Its routes catch /pour*, but every web page is asked of the main "ipconfig" Worker first;
# Pour answers only its machine endpoints and the pages the main site does not have.
name = "pour"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = false

routes = [
  { pattern = "ipconfig.co.network/pour", zone_name = "ipconfig.co.network" },
  { pattern = "ipconfig.co.network/pour/*", zone_name = "ipconfig.co.network" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[r2_buckets]]
binding = "REGISTRY"
bucket_name = "pour-registry-13-oct-2026"

[vars]
SITE_HOST = "ipconfig.co.network"
GITHUB_OWNER = "JKS-sys"
CF_ANALYTICS_TOKEN = "61945bd772044cf88341dd69c64cc920"

# The main site answers first; Pour's pages are the fallback (see src/worker.js).
[[services]]
binding = "SITE"
service = "ipconfig"
